<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061012"/>
      <stop offset="1" stop-color="#0a1b1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0.0" r="0.5">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2dd4bf" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <!-- Linea de escaneo -->
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;320" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Texto -->
    <text x="80" y="98" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" letter-spacing="3" fill="#2dd4bf">FULL STACK  /  AI ENGINEERING  /  PENTESTING</text>
    <text x="78" y="168" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="url(#title)">Brayan Caicedo</text>
    <text x="80" y="208" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#8fa3ab">Software, inteligencia artificial y seguridad ofensiva para empresas.</text>

    <!-- Etiquetas -->
    <g font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="13" text-anchor="middle" fill="#99f6e4">
      <rect x="80" y="236" width="106" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <text x="133" y="255">TypeScript</text>
      <rect x="196" y="236" width="83" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <text x="237.5" y="255">Next.js</text>
      <rect x="289" y="236" width="75" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <text x="326.5" y="255">Python</text>
      <rect x="374" y="236" width="106" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <text x="427" y="255">AI Agents</text>
      <rect x="490" y="236" width="106" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <text x="543" y="255">Kali Linux</text>
      <rect x="606" y="236" width="122" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <text x="667" y="255">Unreal Engine</text>
    </g>

    <!-- Radar -->
    <g transform="translate(960 160)">
      <circle r="118" fill="#2dd4bf" fill-opacity="0.03" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <circle r="80" fill="none" stroke="#2dd4bf" stroke-opacity="0.22"/>
      <circle r="42" fill="none" stroke="#2dd4bf" stroke-opacity="0.18"/>
      <path d="M-130 0H130M0 -130V130" stroke="#2dd4bf" stroke-opacity="0.15"/>
      <g stroke="#2dd4bf" stroke-opacity="0.5">
        <path d="M0 -118v10M0 118v-10M-118 0h10M118 0h-10"/>
      </g>
      <g>
        <path d="M0 0L0 -118A118 118 0 0 1 75.85 -90.39Z" fill="url(#sweep)"/>
        <path d="M0 0L75.85 -90.39" stroke="#5eead4" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </g>
      <circle r="3" fill="#5eead4"/>

      <!-- Objetivos -->
      <g font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="11" fill="#5eead4">
        <circle cx="52" cy="-58" r="4" fill="#5eead4">
          <animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="62" y="-54">443/tcp</text>
        <circle cx="-66" cy="34" r="4" fill="#5eead4">
          <animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="-118" y="56">AI agent</text>
        <circle cx="38" cy="70" r="4" fill="#5eead4">
          <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <text x="48" y="74">CVE</text>
      </g>
    </g>

    <!-- Esquinas tipo mira -->
    <g fill="none" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="2">
      <path d="M24 52V24H52"/>
      <path d="M1148 24H1176V52"/>
      <path d="M24 268V296H52"/>
      <path d="M1148 296H1176V268"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#2dd4bf" stroke-opacity="0.18"/>
</svg>
